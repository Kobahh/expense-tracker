<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense</title>
</head>
<body>
    <h1>Edit Expense</h1>
    <form method="POST" action="/edit_expense/{{ expense[0] }}">
        <label>Amount:</label>
        <input type="number" step="0.01" name="amount" value="{{ expense[2] }}">

        <label>Category:</label>
        <input type="text" name="category" value="{{ expense[3] }}">

        <label>Description:</label>
        <input type="text" name="description" value="{{ expense[4] }}">

        <label>Date:</label>
        <input type="date" name="date" value="{{ expense[5] }}">

        <button type="submit">Update Expense</button>
    </form>
</body>
</html>
